<!DOCTYPE html>

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            border-radius: 0;
            background: transparent;
            padding-left: 0;
            padding-right: 0;
            transition: border-color 0.3s ease;
        }
        
        .ghost-input:focus {
            box-shadow: none;
            border-bottom-color: #1b1c1c;

    body {
      min-height: max(884px, 100dvh);

<body class="bg-[#FAF7F2] min-h-screen text-on-surface font-body-md watermark-bg relative selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Transactional intent implies simplified nav) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 bg-white/70 backdrop-blur-xl shadow-[0_20_40px_rgba(34,34,34,0.05)] border-b border-outline-variant/10">
<div class="flex items-center gap-2 text-primary dark:text-primary-fixed hover:opacity-80 transition-opacity cursor-pointer">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Cancel</span>
</div>
<div class="font-headline-md text-headline-md-mobile md:text-headline-sm text-primary dark:text-primary-fixed tracking-tight">
            Forever Vow
        </div>
<div class="w-20"></div> <!-- Spacer for flex balance -->
</header>
<!-- Main Content -->
<main class="pt-32 pb-24 px-margin-mobile md:px-margin-desktop flex flex-col items-center justify-center min-h-screen">
<div class="w-full max-w-[600px] flex flex-col gap-stack-lg">
<!-- Progress Header -->
<div class="flex flex-col items-center gap-stack-md text-center">
<div class="flex items-center justify-center gap-4 w-full px-12">
<div class="flex flex-col items-center gap-2 flex-1">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-label-md text-label-md shadow-sm">1</div>
<span class="font-label-sm text-label-sm text-on-surface uppercase tracking-widest hidden sm:block">Basics</span>
</div>
<div class="flex-1 h-[1px] bg-primary-container/30 rounded-full mx-2"></div>
<div class="flex flex-col items-center gap-2 flex-1">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-label-md text-label-md border border-outline-variant/30">2</div>
<span class="font-label-sm text-label-sm text-on-surface-variant opacity-50 uppercase tracking-widest hidden sm:block">Style</span>
</div>
<div class="flex-1 h-[1px] bg-surface-container-highest rounded-full mx-2"></div>
<div class="flex flex-col items-center gap-2 flex-1">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-label-md text-label-md border border-outline-variant/30">3</div>
<span class="font-label-sm text-label-sm text-on-surface-variant opacity-50 uppercase tracking-widest hidden sm:block">Guests</span>
</div>
<div class="flex-1 h-[1px] bg-surface-container-highest rounded-full mx-2"></div>
<div class="flex flex-col items-center gap-2 flex-1">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-label-md text-label-md border border-outline-variant/30">4</div>
<span class="font-label-sm text-label-sm text-on-surface-variant opacity-50 uppercase tracking-widest hidden sm:block">Review</span>
</div>
</div>
<div class="mt-stack-sm space-y-2">
<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface">The Beginning</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">Let's start with the essential details of your special day.</p>
</div>
</div>
<!-- Form Card -->
<div class="bg-white/80 backdrop-blur-2xl rounded-[24px] p-margin-mobile md:p-stack-lg shadow-[0_20_40px_rgba(34,34,34,0.05)] border border-[#F0EBE0] flex flex-col gap-stack-md">
<!-- Couple Names -->
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest" for="coupleNames">The Couple</label>
<input class="ghost-input w-full font-headline-sm text-headline-sm-mobile md:text-headline-sm text-on-surface placeholder:text-on-surface-variant/30 focus:ring-0" id="coupleNames" placeholder="e.g., Alex &amp; Jordan" type="text"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Date -->
<div class="flex flex-col gap-unit relative group">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest" for="weddingDate">Wedding Date</label>
<div class="relative">
<input class="ghost-input w-full font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/30 focus:ring-0 cursor-pointer appearance-none bg-transparent relative z-10" id="weddingDate" style="color-scheme: light;" type="date"/>
</div>
</div>
<!-- Location -->
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest" for="location">Location</label>
<div class="relative flex items-end">
<span class="material-symbols-outlined absolute right-0 bottom-3 text-on-surface-variant/50 pointer-events-none" data-icon="location_on">location_on</span>
<input class="ghost-input w-full font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/30 focus:ring-0 pr-8" id="location" placeholder="City or Venue" type="text"/>
</div>
</div>
</div>
</div>

<div class="flex justify-end mt-unit">
<button class="bg-primary-container text-on-primary-container px-8 py-4 rounded-full font-label-md text-label-md uppercase tracking-wider hover:scale-[1.02] hover:shadow-[0_0_15px_rgba(212,175,55,0.4)] transition-all duration-300 flex items-center gap-2 group">
                    Next Step
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
