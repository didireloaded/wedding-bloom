<body class="bg-background text-on-background overflow-hidden h-screen flex flex-col font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 bg-white/70 dark:bg-surface/70 backdrop-blur-xl shadow-[0_20_40px_rgba(34,34,34,0.05)] border-b border-outline-variant/10">
<div class="flex items-center gap-4">
<button aria-label="Menu" class="text-on-surface-variant dark:text-outline-variant hover:opacity-80 transition-opacity active:scale-[0.98] transition-transform duration-200">
<span class="material-symbols-outlined text-[24px]">menu</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile md:text-headline-md text-primary dark:text-primary-fixed tracking-tight">Forever Vow</h1>
</div>
<div class="flex items-center gap-4">
<!-- Save Status -->
<div class="hidden md:flex items-center gap-2 text-on-surface-variant font-label-md text-label-md">
<span class="material-symbols-outlined text-[16px] text-tertiary">check_circle</span>
<span>All changes saved</span>
</div>
<button aria-label="User Profile" class="text-on-surface-variant dark:text-outline-variant hover:opacity-80 transition-opacity active:scale-[0.98] transition-transform duration-200">
<div class="w-8 h-8 rounded-full bg-surface-variant overflow-hidden border border-outline-variant/30 flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">person</span>
</div>
</button>
</div>
</header>
<!-- Main Editor Area -->
<main class="flex-1 mt-16 relative flex bg-surface-container-lowest">
<!-- Sidebar (Tools & Settings) - Hidden on mobile, visible on desktop -->
<aside class="hidden md:flex flex-col w-80 bg-surface border-r border-outline-variant/10 z-10 p-6 overflow-y-auto shadow-[20px_0_40px_rgba(34,34,34,0.02)]">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-stack-md">Venue Layout</h2>
<div class="space-y-stack-md">
<!-- Dimensions Set -->
<div class="space-y-stack-sm">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Canvas Settings</h3>
<div class="bg-white rounded-DEFAULT p-4 border border-outline-variant/20 shadow-[0_4px_12px_rgba(34,34,34,0.02)]">
<div class="flex justify-between items-center mb-2">
<span class="font-body-md text-body-md text-on-surface">Dimensions</span>
<span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-variant px-2 py-1 rounded">100 x 80 ft</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface">Snap to Grid</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-9 h-5 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-tertiary"></div>
</label>
</div>
</div>
</div>
<!-- Stats Overview -->
<div class="space-y-stack-sm">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Current Capacity</h3>
<div class="grid grid-cols-2 gap-4">
<div class="bg-tertiary-fixed/30 rounded-DEFAULT p-4 border border-tertiary-fixed shadow-[0_4px_12px_rgba(34,34,34,0.02)]">
<div class="font-headline-md text-headline-md text-tertiary mb-1">120</div>
<div class="font-label-sm text-label-sm text-on-tertiary-container">Seated Guests</div>
</div>
<div class="bg-secondary-container/30 rounded-DEFAULT p-4 border border-secondary-container shadow-[0_4px_12px_rgba(34,34,34,0.02)]">
<div class="font-headline-md text-headline-md text-secondary mb-1">12</div>
<div class="font-label-sm text-label-sm text-on-secondary-container">Tables Placed</div>
</div>
</div>
</div>
<!-- Minimap / Venue Outline Placeholder -->
<div class="space-y-stack-sm mt-auto">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Grand Ballroom</h3>
<div class="w-full h-40 bg-surface-variant rounded-DEFAULT border border-outline-variant/20 overflow-hidden relative" data-alt="A delicate, architectural top-down blueprint sketch of a grand ballroom venue, drawn with fine lines in soft charcoal gray on a pristine ivory background. The style is minimalist, elegant, and highly precise, resembling luxury wedding planning documentation. Natural light seems to wash over the subtle paper texture, giving it a premium, physical feel." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCLA-C6mwHYd5STFhp4LcwK6ndD9gMsXDT2wMK-82g6uzEyTpH4XqDfWE1gIxfrFO5IenEe8GGxuZN2VDIQRqsz2BHjHRKcAbDNq90kMkXzUY5nl8AOjJEXhqZJc3QlDf85qGHSOto1m2qooGQJlebPLCKaVueo0PCjQd1Db3x1UxDARP7qdJm8tO8-NE1GMGcL1keASjfUfNaUpkyDAcDw_DUL1e9tOTBjx2ca7oqGgMAogyR0zk8S')">
<!-- Simulated view finder -->
<div class="absolute inset-4 border-2 border-primary-container rounded bg-primary-fixed/10"></div>
</div>
</div>
</div>
</aside>
<!-- Canvas Area -->
<div class="flex-1 relative overflow-hidden bg-grid cursor-move">
<!-- Zoom Controls -->
<div class="absolute top-6 right-6 flex flex-col gap-2 z-20">
<button class="w-10 h-10 bg-white/90 backdrop-blur-md rounded-full shadow-[0_8px_16px_rgba(34,34,34,0.08)] border border-outline-variant/10 flex items-center justify-center text-on-surface hover:text-primary transition-colors">
<span class="material-symbols-outlined">add</span>
</button>
<button class="w-10 h-10 bg-white/90 backdrop-blur-md rounded-full shadow-[0_8px_16px_rgba(34,34,34,0.08)] border border-outline-variant/10 flex items-center justify-center text-on-surface hover:text-primary transition-colors">
<span class="material-symbols-outlined">remove</span>
</button>
<button class="w-10 h-10 bg-white/90 backdrop-blur-md rounded-full shadow-[0_8px_16px_rgba(34,34,34,0.08)] border border-outline-variant/10 flex items-center justify-center text-on-surface hover:text-primary transition-colors mt-2" title="Reset View">
<span class="material-symbols-outlined">center_focus_strong</span>
</button>
</div>
<!-- The Floorplan Container (Movable) -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[800px] h-[600px] border border-outline-variant/20 rounded-lg bg-white/40 backdrop-blur-sm shadow-[0_20px_40px_rgba(34,34,34,0.03)] relative" id="canvas-container">
<!-- Room Outline/Walls (Decorative) -->
<div class="absolute inset-4 border-2 border-surface-variant rounded-lg"></div>
<!-- Entrance Marker -->
<div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 translate-y-1/2 bg-surface px-4 py-1 border-2 border-surface-variant rounded font-label-sm text-label-sm text-on-surface-variant tracking-widest">ENTRANCE</div>
<!-- Placed Elements -->
<!-- Main Stage -->
<div class="draggable-item absolute top-12 left-1/2 transform -translate-x-1/2 w-96 h-32 bg-surface-container-high rounded border border-outline-variant/30 flex items-center justify-center shadow-[0_12px_24px_rgba(34,34,34,0.05)] transition-shadow hover:shadow-[0_16px_32px_rgba(34,34,34,0.08)]">
<span class="font-label-md text-label-md text-on-surface-variant">Stage / Head Table</span>
</div>
<!-- Dance Floor -->
<div class="draggable-item absolute top-56 left-1/2 transform -translate-x-1/2 w-64 h-64 border-2 border-dashed border-tertiary/30 bg-tertiary-fixed/10 rounded flex items-center justify-center">
<span class="font-label-md text-label-md text-tertiary/70">Dance Floor</span>
</div>
<!-- Round Tables -->
<div class="draggable-item absolute top-56 left-20 w-24 h-24 rounded-full bg-white border border-outline-variant/30 flex items-center justify-center shadow-[0_8px_16px_rgba(34,34,34,0.06)] group">
<span class="font-label-sm text-label-sm text-on-surface-variant">T1</span>
<!-- Seat markers -->
<div class="absolute -top-1 w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="absolute -bottom-1 w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="absolute -left-1 w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="absolute -right-1 w-2 h-2 rounded-full bg-outline-variant"></div>
</div>
<div class="draggable-item absolute top-56 right-20 w-24 h-24 rounded-full bg-white border border-outline-variant/30 flex items-center justify-center shadow-[0_8px_16px_rgba(34,34,34,0.06)] group">
<span class="font-label-sm text-label-sm text-on-surface-variant">T2</span>
<!-- Seat markers -->
<div class="absolute -top-1 w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="absolute -bottom-1 w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="absolute -left-1 w-2 h-2 rounded-full bg-outline-variant"></div>

</div>

<div class="draggable-item absolute bottom-16 right-16 w-48 h-16 bg-surface-container-high rounded border border-outline-variant/30 flex items-center justify-center shadow-[0_8px_16px_rgba(34,34,34,0.05)]">
<span class="material-symbols-outlined text-[18px] mr-2 text-on-surface-variant">local_bar</span>
<span class="font-label-md text-label-md text-on-surface-variant">Main Bar</span>
</div>
</div>
</div>
</main>
<!-- Floating Action Bar (Bottom Nav for Tools) -->
<!-- Positioned absolutely within the viewport, resting at the bottom -->
<div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50">
<div class="bg-white/80 dark:bg-surface/80 backdrop-blur-2xl px-6 py-4 rounded-full shadow-[0_20px_40px_rgba(34,34,34,0.1)] border border-outline-variant/10 flex items-center gap-8">
<!-- Tool: Table -->
<button aria-label="Add Table" class="flex flex-col items-center gap-1 group text-primary dark:text-primary-fixed scale-110 transition-all font-semibold">
<div class="w-12 h-12 rounded-full bg-primary-container/10 flex items-center justify-center group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-[24px]">table_restaurant</span>
</div>
<span class="font-label-sm text-[10px] uppercase tracking-wider">Table</span>
</button>
<!-- Tool: Stage -->
<button aria-label="Add Stage" class="flex flex-col items-center gap-1 group text-on-surface-variant dark:text-outline-variant opacity-60 hover:opacity-100 transition-opacity">
<div class="w-12 h-12 rounded-full flex items-center justify-center group-hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[24px]">podium</span>
</div>
<span class="font-label-sm text-[10px] uppercase tracking-wider">Stage</span>
</button>
<!-- Tool: Dance Floor -->
<button aria-label="Add Dance Floor" class="flex flex-col items-center gap-1 group text-on-surface-variant dark:text-outline-variant opacity-60 hover:opacity-100 transition-opacity">
<div class="w-12 h-12 rounded-full flex items-center justify-center group-hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[24px]">crop_din</span>
</div>
<span class="font-label-sm text-[10px] uppercase tracking-wider">Dance</span>
</button>
<!-- Tool: Entrance -->
<button aria-label="Add Entrance" class="flex flex-col items-center gap-1 group text-on-surface-variant dark:text-outline-variant opacity-60 hover:opacity-100 transition-opacity">
<div class="w-12 h-12 rounded-full flex items-center justify-center group-hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[24px]">meeting_room</span>
</div>
<span class="font-label-sm text-[10px] uppercase tracking-wider">Entry</span>
</button>
<!-- Tool: Bar -->
<button aria-label="Add Bar" class="flex flex-col items-center gap-1 group text-on-surface-variant dark:text-outline-variant opacity-60 hover:opacity-100 transition-opacity">
<div class="w-12 h-12 rounded-full flex items-center justify-center group-hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[24px]">local_bar</span>
</div>
<span class="font-label-sm text-[10px] uppercase tracking-wider">Bar</span>
</button>
<div class="w-[1px] h-8 bg-outline-variant/30 mx-2"></div>
<!-- Action: Export/Save -->
<button class="bg-primary-container text-on-primary-container px-6 py-3 rounded-full font-label-md text-label-md shadow-[0_8px_16px_rgba(212,175,55,0.2)] hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center gap-2">
<span>Save Layout</span>
<span class="material-symbols-outlined text-[18px]">save</span>
</button>
</div>
</div>
