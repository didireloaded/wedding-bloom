<style>
        /* Custom utilities not easily achievable with basic Tailwind classes */
        .glass-card {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid #F0EBE0;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(34, 34, 34, 0.05);
        }
        
        .shimmer-text {
            background: linear-gradient(90deg, #1b1c1c 0%, #735c00 50%, #1b1c1c 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        .stagger-item {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        
        .stagger-item.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Atmospheric background blob */
        .bg-blob {

            width: 80vw;
            height: 80vw;

<script>
        // Micro-interaction: Sequentially reveal insights to simulate AI processing
        document.addEventListener("DOMContentLoaded", () => {
            const items = document.querySelectorAll('.stagger-item');
            
            items.forEach((item, index) => {
                setTimeout(() => {
                    item.classList.add('visible');
                    
                    // Add a subtle brief highlight effect when revealed
                    item.style.backgroundColor = 'rgba(212, 175, 55, 0.1)';
                    setTimeout(() => {
                        item.style.backgroundColor = '';
                    }, 400);

                }, 600 + (index * 800)); // Delay start by 600ms, then 800ms between each
            });
        });
    </script>
