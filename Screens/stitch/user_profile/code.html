<body class="bg-background text-on-surface min-h-screen font-body-md flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface sticky top-0 z-50 flex justify-between items-center px-container-padding h-16 w-full">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary hover:opacity-80 transition-opacity duration-200">arrow_back</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary">Wedding Bloom</h1>
</div>
<button class="material-symbols-outlined text-primary hover:opacity-80 transition-opacity duration-200">more_horiz</button>
</header>
<main class="flex-1 px-container-padding pt-stack-md pb-32">
<!-- Profile Header Section -->
<section class="flex flex-col items-center text-center mb-stack-lg">
<div class="relative mb-stack-md">
<div class="w-24 h-24 rounded-full overflow-hidden ambient-card p-1 bg-surface">

</div>
<div class="absolute bottom-0 right-0 bg-primary p-1.5 rounded-full text-white flex items-center justify-center">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">edit</span>
</div>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-1">Sarah &amp; David</h2>
<p class="font-body-sm text-outline mb-stack-md">June 21, 2025 • The Grand Ballroom</p>
<!-- Wedding Date Countdown/Display -->
<div class="bg-primary-container px-6 py-3 rounded-xl inline-flex items-center gap-3 ambient-card">
<span class="material-symbols-outlined text-primary">calendar_today</span>
<div>
<p class="font-label-caps text-label-caps text-on-primary-container">COUNTDOWN</p>
<p class="font-headline-md text-headline-md text-primary">120 Days to Go</p>
</div>
</div>
</section>
<!-- Call to Action -->
<div class="mb-stack-lg">
<button class="w-full bg-primary-container text-on-primary-container py-4 px-6 rounded-xl font-body-md font-semibold flex items-center justify-center gap-2 ambient-card hover:opacity-90 transition-all active:scale-[0.98] lavender-glow">
<span class="material-symbols-outlined">person_add</span>
        Invite Collaborator
      </button>
</div>
<!-- Settings Groups -->
<div class="space-y-stack-md">
<h3 class="font-label-caps text-label-caps text-outline px-2 uppercase tracking-widest">General Settings</h3>
<div class="bg-surface ambient-card rounded-xl overflow-hidden">
<!-- Account Settings -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors text-left border-b border-outline-variant">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-primary">manage_accounts</span>
</div>
<div>
<p class="font-body-md font-semibold text-on-surface">Account Settings</p>
<p class="font-body-sm text-outline">Manage your profile and login details</p>
</div>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
<!-- Notification Preferences -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors text-left border-b border-outline-variant">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-primary">notifications_active</span>
</div>
<div>
<p class="font-body-md font-semibold text-on-surface">Notification Preferences</p>

</div>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>

<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors text-left">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-primary">security</span>
</div>
<div>
<p class="font-body-md font-semibold text-on-surface">Privacy &amp; Data</p>
<p class="font-body-sm text-outline">Your personal information and security</p>
</div>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
</div>
<h3 class="font-label-caps text-label-caps text-outline px-2 uppercase tracking-widest pt-4">Data Management</h3>
<div class="bg-surface ambient-card rounded-xl overflow-hidden">
<!-- Export Planning Data -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors text-left">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-tertiary-container flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary">download</span>
</div>
<div>
<p class="font-body-md font-semibold text-on-surface">Export Planning Data</p>
<p class="font-body-sm text-outline">Download your wedding as CSV or PDF</p>
</div>
</div>
<span class="material-symbols-outlined text-outline">file_download</span>
</button>
</div>
</div>

<div class="mt-stack-lg text-center">
<button class="text-error font-body-md font-semibold px-8 py-3 rounded-full border border-error-container hover:bg-error-container/10 transition-colors">
        Log Out

<p class="font-body-sm text-outline-variant mt-4">Wedding Bloom v2.4.1</p>
</div>

<a class="flex flex-col items-center justify-center text-outline transition-transform scale-95 active:scale-90" href="#">

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-caps text-[10px] mt-1">Profile</span>
</a>
</nav>
<script>
    // Lightweight interaction logic
    document.querySelectorAll('button, a').forEach(el => {
      el.addEventListener('click', (e) => {
        // Prevent default for demo purposes
        if(el.tagName === 'A') e.preventDefault();
        
        // Micro-ripple or visual feedback
        el.style.opacity = '0.7';
        setTimeout(() => {
          el.style.opacity = '1';
        }, 150);
      });
    });
  </script>
